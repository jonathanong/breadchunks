name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust tests with coverage
        run: |
          mkdir -p target/llvm-cov && cd crate
          cargo llvm-cov --package breadchunks --show-missing-lines --fail-under-lines 99 --lcov --output-path ../target/llvm-cov/lcov.info

      - name: Run breadchunks-node tests
        run: cargo test --package breadchunks-node

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          use_oidc: true
          files: target/llvm-cov/lcov.info
          flags: rust
          fail_ci_if_error: false

      - name: Install Node dependencies
        working-directory: package
        run: npm install

      - name: Build native module
        working-directory: package
        run: npm run build:debug

      - name: Run Node tests
        working-directory: package
        run: npm test
