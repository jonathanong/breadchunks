name: Dependabot PR Auto-merge

# NOTE: pull_request_target gives this workflow access to repo secrets and
# runs with write permissions. We intentionally do NOT checkout the PR head —
# doing so would let a malicious dependency PR execute code with our secrets.
# If you add an actions/checkout step here, restrict it to
# github.event.pull_request.base.sha only.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@v9
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            function hasActiveApproval(reviews) {
              const latestStateByUser = new Map();
              const sortedReviews = [...reviews].sort((a, b) => {
                return new Date(a.submitted_at ?? 0).getTime() - new Date(b.submitted_at ?? 0).getTime();
              });

              for (const review of sortedReviews) {
                latestStateByUser.set(review.user.login, review.state);
              }

              return [...latestStateByUser.values()].includes('APPROVED');
            }

            function errorMessage(error) {
              return error instanceof Error ? error.message : String(error);
            }

            core.info(`Evaluating PR #${pr.number} (${pr.title})`);

            if (pr.draft) {
              core.info('Skipping draft pull request');
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            if (hasActiveApproval(reviews)) {
              core.info('Approval already present');
            } else {
              core.info('Approving PR');
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: pr.number,
                  event: 'APPROVE',
                });
              } catch (error) {
                core.warning(
                  'Could not approve PR with GITHUB_TOKEN: '
                  + `${errorMessage(error)}. If approvals are required, enable `
                  + '"Allow GitHub Actions to create and approve pull requests" '
                  + 'in the repository Actions settings.'
                );
              }
            }

            const { data: freshPr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });

            if (freshPr.auto_merge) {
              core.info('Auto-merge already enabled');
              return;
            }

            core.info('Enabling auto-merge');
            try {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }
              `, { pullRequestId: freshPr.node_id });
              core.info('Done: auto-merge enabled');
            } catch (error) {
              core.warning(
                'Could not enable auto-merge: '
                + `${errorMessage(error)}. Confirm repository auto-merge is `
                + 'enabled and squash merging is allowed.'
              );
            }
