max-files-changed: 100

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "package/package.json"
          - ".github/dependabot.yml"

npm:
  - changed-files:
      - any-glob-to-any-file:
          - "package/package.json"
          - "package/index.js"
          - "package/index.d.ts"
          - "package/src/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "LICENSE"
          - "fixtures/**"

rust:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.toml"
          - "Cargo.lock"
          - "crate/**/*.rs"
          - "crate/Cargo.toml"
          - "package/src/**/*.rs"
          - "package/Cargo.toml"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "crate/tests/**"
          - "package/__test__/**"
          - "fixtures/**"
