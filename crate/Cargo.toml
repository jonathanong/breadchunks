[package]
name = "breadchunks"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Heading-aware, token-budgeted semantic chunker for Markdown — for RAG and embedding pipelines."
repository = "https://github.com/jonathanong/breadchunks"
readme = "README.md"
keywords = ["markdown", "chunking", "rag", "embedding", "llm"]
categories = ["text-processing"]

[dependencies]
regex = "1.11"

[[bench]]
name = "breadcrumb_bench"
harness = false

[dev-dependencies]
criterion = "0.5.1"
