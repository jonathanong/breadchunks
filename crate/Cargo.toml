[package]
name = "breadchunks"
version = "0.2.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Heading-aware, token-budgeted semantic chunker for Markdown — for RAG and embedding pipelines."
repository = "https://github.com/jonathanong/breadchunks"
readme = "README.md"
keywords = ["markdown", "chunking", "rag", "embedding", "llm"]
categories = ["text-processing"]

[dependencies]
lazy-regex = "3.6.0"
regex = "1.11"

[[bench]]
name = "breadcrumb_bench"
harness = false

[[bench]]
name = "split_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "restore_bench"
harness = false
